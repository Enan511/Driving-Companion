name: Android verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-windows-toolchain:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/cache@v4
        with:
          path: |
            .tools
            .local/gradle
          key: windows-toolchain-${{ hashFiles('tools/toolchain.json', 'android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle/libs.versions.toml') }}
      - name: Bootstrap project tools
        shell: pwsh
        run: ./scripts/bootstrap.ps1 -AcceptAndroidLicenses
      - name: Inspect native-development environment
        shell: pwsh
        run: ./scripts/doctor.ps1
      - name: Test, lint, and build Phase 1
        shell: pwsh
        run: ./scripts/gradle.ps1 :check :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: phase1-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-verification-reports
          path: |
            android/core/drive/build/reports/tests/test
            android/app/build/reports/tests/testDebugUnitTest
            android/app/build/reports/lint-results-debug.html
          retention-days: 14
